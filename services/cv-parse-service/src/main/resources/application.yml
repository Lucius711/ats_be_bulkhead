server:
  port: 8085

spring:
  application:
    name: cv-parse-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ats_cvs_dbs
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: CvParseHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    # ============================================================
    # JPA / HIBERNATE
    # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

resilience4j:
  bulkhead:
    instances:
      cvParse:
        maxConcurrentCalls: 5
        maxWaitDuration: 5s

  thread-pool-bulkhead:
    instances:
      cvParsePool:
        coreThreadPoolSize: 3
        maxThreadPoolSize: 5
        queueCapacity: 6
        keepAliveDuration: 20ms

management:
  endpoints:
    web:
      exposure:
        include: health,bulkheads,metrics

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  file:
    name: ${user.home}/cv-parse-demo.log
