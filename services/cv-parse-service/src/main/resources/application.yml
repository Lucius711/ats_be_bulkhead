server:
  port: 8085            # khop route cv-parse-service trong api-gateway
  tomcat:
    threads:
      max: 10           # DEMO: thu nho tu 200 -> 10 de thay ro hien tuong can thread (25 CV/s x 8s = 200 thread)

spring:
  application:
    name: cv-parse-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ats_cvs_dbs
    username: dieunt
    password:
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: CvParseHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    # ============================================================
    # JPA / HIBERNATE
    # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# ============================================================
# BULKHEAD (Semaphore) - phan demo
# ============================================================
resilience4j:
  bulkhead:
    instances:
      cvAnalysis:
        maxConcurrentCalls: 3        # toi da 3 CV duoc phan tich dong thoi
        maxWaitDuration: 0ms         # het permit -> tu choi ngay (doi thanh 2s de demo "cho co dieu kien")
        eventConsumerBufferSize: 50  # de /actuator/bulkheadevents co du lieu

management:
  endpoints:
    web:
      exposure:
        include: health,bulkheads,bulkheadevents,metrics

demo:
  cv-analysis:
    delay-ms: 8000   # gia lap OCR/AI mat 8 giay moi CV
