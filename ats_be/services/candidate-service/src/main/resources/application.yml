server:
  port: ${CANDIDATE_SERVICE_PORT:8082}

spring:
  application:
    name: candidate-service
  config:
    import:
      - optional:file:${ENV_FILE:.env}[.properties]
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:ats}
    password: ${SPRING_RABBITMQ_PASSWORD:ats_dev_password}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CANDIDATE_DB_NAME:ats_candidate_dbs}
    username: ${DB_USERNAME:dieunt}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: CandidateHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    # ============================================================
    # JPA / HIBERNATE
    # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

candidate:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123}
    bucket: ${MINIO_BUCKET:ats-cv}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}  # Địa chỉ Eureka Server
    fetch-registry: true      # Tải registry về local cache
    register-with-eureka: true  # Đăng ký bản thân vào registry
  instance:
    prefer-ip-address: true    # Dùng IP thay hostname - quan trọng trong Docker
    lease-renewal-interval-in-seconds: 10   # Heartbeat mỗi 10s (dev)
    lease-expiration-duration-in-seconds: 30  # Expiry sau 30s không có heartbeat
