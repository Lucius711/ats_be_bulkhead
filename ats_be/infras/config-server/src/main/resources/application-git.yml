spring:
  config:
    activate:
      on-profile: git

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:config-repo}
          clone-on-start: true
          force-pull: true
          refresh-rate: ${CONFIG_GIT_REFRESH_RATE:60}
          timeout: ${CONFIG_GIT_TIMEOUT:10}
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_PASSWORD:}
