server:
  port: ${APPLICATION_SERVICE_PORT:8083}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${APPLICATION_DB_NAME:ats_application_dbs}
    username: ${DB_USERNAME:dieunt}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ApplicationHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

job-service:
  url: ${JOB_SERVICE_URL:http://localhost:8081}

candidate-service:
  url: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
