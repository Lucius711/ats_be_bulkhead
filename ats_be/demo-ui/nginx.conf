# Giao diện demo: luôn bắt trình duyệt hỏi lại máy chủ để sửa file xong chỉ cần F5 là thấy bản mới.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /nginx.conf { return 404; }
}
