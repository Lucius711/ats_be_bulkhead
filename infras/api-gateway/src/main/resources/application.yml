server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: job-service
              uri: lb://job-service
              predicates:
                - Path=/api/v1/jobs/**
            - id: candidate-service
              uri: lb://candidate-service
              predicates:
                - Path=/api/v1/candidates/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications
            - id: application-service
              uri: lb://application-service
              predicates:
                - Path=/api/v1/applications/**
#              filters:
#                - args: RequestRateLimiter
#                  name:
#                    redis-rate-limiter.replenishRate: 10   # tokens added per second
#                    redis-rate-limiter.burstCapacity: 20   # max tokens in the bucket
#                    redis-rate-limiter.requestedTokens: 1  # tokens consumed per request
#                    key-resolver: "#{@ipKeyResolver}"
#                    deny-empty-key: true
#                    empty-key-status-code: 403

            - id: cv-parse-service
              uri: lb://cv-parse-service
              predicates:
                - Path=/api/v1/cvparses/**
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}  # THAY THẾ BẰNG CLIENT ID CỦA BẠN TỪ GOOGLE CLOUD CONSOLE
            client-secret: ${GOOGLE_CLIENT_SECRET} # THAY THẾ BẰNG CLIENT SECRET CỦA BẠN TỪ GOOGLE CLOUD CONSOLE
            scope:
              - openid # Yêu cầu ID Token (định danh người dùng)
              - profile # Yêu cầu thông tin hồ sơ cơ bản (tên, ảnh)
              - email # Yêu cầu địa chỉ email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}" # URI chuyển hướng sau khi xác thực thành công
            # Lưu ý: redirect-uri này phải khớp với URI đã đăng ký trong Google Cloud Console
            # Đối với demo, nó sẽ là http://localhost:8080/login/oauth2/code/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth # Endpoint ủy quyền của Google
            token-uri: https://oauth2.googleapis.com/token # Endpoint lấy token của Google
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo # Endpoint thông tin người dùng của Google
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs # Endpoint JWK Set của Google
      #          facebook:

      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Địa chỉ Eureka Server
    fetch-registry: true      # Tải registry về local cache
    register-with-eureka: true  # Đăng ký bản thân vào registry
  instance:
    prefer-ip-address: true    # Dùng IP thay hostname - quan trọng trong Docker
    lease-renewal-interval-in-seconds: 10   # Heartbeat mỗi 10s (dev)
    lease-expiration-duration-in-seconds: 30  # Expiry sau 30s không có heartbeat

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG